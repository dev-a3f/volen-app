<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Волен · MVP: главная, ски-пасс, парковка</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Брендбук Figma Volen · токен 14264E + шкалы Blue / Yellow / Red / Neutral */
  --bg:#f4f8ff;
  --ink:#14264e;
  --mute:#555555;
  --line:#d8e6ff;
  --card:#fff;
  --brand:#14264e;
  --brand-deep:#0a2b63;
  --coral:#d14135;
  --navy:#14264e;
  --navy-2:#0a2b63;
  --blue:#2f73f2;
  --blue-deep:#1d5fc7;
  --wash:#eaf1ff;
  --gold:#f5c84b;
  --slate:#0a2b63;
  --ink-dark:#191919;
  --go:#47603d;
  --hot:#a31c19;
  --ui:"Golos Text",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);background:#dce3ea;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}button{cursor:pointer;border:0;background:none}
.page{display:grid;grid-template-columns:minmax(420px,470px) 1fr;min-height:100vh}
.stage{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 8px;background:#cfd8e2}
.kicker{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.stage h1{font-size:18px;text-align:center;letter-spacing:-.03em}
.sp{font-size:12px;color:#5c6168;text-align:center;max-width:380px;line-height:1.45}
.scenarios{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:400px}
.scenarios button{font-size:11px;padding:7px 10px;border-radius:999px;background:#fff;font-weight:700;border:1px solid #d5d8de}
.phone{width:390px;height:844px;flex:none;background:#1a1a1a;border-radius:46px;padding:10px;box-shadow:0 24px 70px #0004}
.phone-inner{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;background:var(--bg)}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:#111;border-radius:4px;opacity:.4;z-index:60}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.status{height:46px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.body{flex:1;overflow:auto;padding:0 16px 104px}
.body::-webkit-scrollbar{width:0}
.tabbar{position:absolute;left:12px;right:12px;bottom:18px;height:66px;padding:5px 6px;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);z-index:20;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px -10px #0004,0 1px 2px #0000000a,inset 0 1px 0 rgba(255,255,255,.9)}
.tabbar:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(24,39,73,.08)}
.tabbar button{position:relative;color:#7a706c;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:18px;transition:color .2s,background-color .2s}
.tabbar button svg{width:24px;height:24px;transition:transform .2s}
.tabbar button.on{color:var(--brand);background:rgba(20,38,78,.09)}
.tabbar button.on svg{transform:translateY(-1px)}
.tabbar button:hover{color:var(--brand-deep)}
@supports not (backdrop-filter:blur(1px)){.tabbar{background:rgba(255,255,255,.96)}}
.h1{font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.15}
.sub{font-size:14px;color:var(--mute);margin-top:6px;line-height:1.45}
.hero{margin:8px 0 18px}
.brand{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--blue);margin-bottom:8px}
.btn{height:52px;width:100%;border-radius:16px;font-weight:800;font-size:16px}
.btn-b{background:var(--ink);color:#fff}
.btn-y{background:var(--brand);color:#fff}
.btn-w{background:#fff;border:1px solid var(--line);color:var(--brand-deep)}
.btn-more{background:var(--wash);color:var(--brand-deep)}
.field{background:#fff;border:1px solid var(--line);border-radius:14px;height:52px;display:flex;align-items:center;padding:0 14px;margin:8px 0;gap:8px}
.field span{font-size:12px;font-weight:700;color:var(--mute);width:58px;flex:none}
.field input{border:0;outline:0;flex:1;font-size:16px;font-weight:700;background:transparent;width:100%}
.otp{display:flex;gap:8px;justify-content:center;margin:20px 0}
.otp input{width:56px;height:64px;border-radius:14px;border:1px solid var(--line);text-align:center;font-size:24px;font-weight:800;background:#fff}
.hint{font-size:12px;color:var(--mute);line-height:1.4;margin-top:10px}
.ok{color:var(--go);font-weight:700}.warn{color:var(--hot);font-weight:700}
.wallet{background:linear-gradient(160deg,var(--blue) 0%,var(--brand) 48%,var(--brand-deep) 100%);color:#fff;border-radius:22px;padding:18px 18px 16px;margin:8px 0 12px;position:relative;overflow:hidden}
.wallet:before{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:#fff2}
.wallet .k{font-size:12px;opacity:.85;font-weight:700}
.wallet .sum{font-size:32px;font-weight:800;margin:8px 0 4px;letter-spacing:-.04em}
.wallet .row2{display:flex;justify-content:space-between;font-size:13px;opacity:.95}
.p-wallet{background:linear-gradient(160deg,#3a3534,var(--slate) 55%,var(--ink-dark))}
.amt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.amt button{height:48px;border-radius:14px;background:#fff;font-weight:800;border:1px solid var(--line)}
.amt button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:0 1px 3px #0000000c;width:100%;text-align:left}
.card b{display:block;font-size:15px}
.meta{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.35}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.box{background:#fff;border-radius:16px;padding:14px;margin:8px 0;box-shadow:0 1px 2px #0000000a}
.back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;margin:2px 0 12px;color:var(--blue)}
.tx{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx:last-child{border:0}
.sheet{position:absolute;inset:0;background:#0005;z-index:40;display:flex;align-items:flex-end}
.panel{background:#fff;border-radius:22px 22px 0 0;padding:10px 16px 28px;width:100%}
.handle{width:36px;height:4px;background:#ddd;border-radius:4px;margin:6px auto 12px}
.payhead{height:120px;border-radius:16px;background:#f6f7f8;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:12px}
.done{width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:28px;margin:20px auto 12px}
.link{color:var(--blue);font-weight:700;font-size:13px;margin-top:12px}
.api{font-family:ui-monospace,Menlo,monospace;font-size:9px;font-weight:700;padding:5px 7px;border-radius:8px;margin:0 0 10px;background:#e7f6ee;color:#0d6a3c;word-break:break-all}
.docs{padding:20px 36px 80px;max-width:880px}
.docs h2{font-size:24px;margin-bottom:8px}.docs h3{margin:22px 0 8px;font-size:16px}
.docs p,.docs li{font-size:14px;line-height:1.55;color:#3a3a38}
.docs .lead{color:#6a6966;margin-bottom:14px}
.docs ul,.docs ol{padding-left:18px}
.docs code{font-size:12px;background:#f3f3f1;padding:1px 5px;border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tbl th,.tbl td{border:1px solid #e4e4e1;padding:8px;text-align:left;vertical-align:top}
.tbl th{background:#f6f6f4}
.money{background:#fff;border-radius:16px;padding:14px 16px;margin:12px 0;border:1px solid #e8e8e6}
.money .big{font-size:28px;font-weight:800;letter-spacing:-.04em}
.topbar{padding:16px 36px 0}
.tabs{display:flex;gap:4px;background:#fff;padding:4px;border-radius:12px;width:fit-content;flex-wrap:wrap}
.tabs button{padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;color:#7a7975}
.tabs button.on{background:var(--brand);color:#fff}

.tophead{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px}
.logo{font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--blue)}
.pill{height:32px;padding:0 12px;border-radius:999px;background:#fff;font-size:12px;font-weight:700;border:1px solid var(--line)}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:0 1px 2px #0000000a}
.toggle button{height:40px;border-radius:11px;font-weight:800;font-size:14px;color:#7a7975}
.toggle button.on{background:var(--brand);color:#fff}
.wx{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wx .deg{font-size:28px;font-weight:800;letter-spacing:-.04em}
.act{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:20px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px #0000000c}
.act .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.act .ico svg{width:26px;height:26px}
.act.skip .ico{background:var(--wash);color:var(--brand)}
.act.park .ico{background:var(--ink);color:#fff}
.act b{display:block;font-size:17px;font-weight:800}
.act span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.act .chev{margin-left:auto;color:#c4c3bf;font-size:22px;font-weight:400}
.guest{background:#f8eee8;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;margin:10px 0}
.guest b{display:block;margin-bottom:2px}
.mosaic{display:grid;grid-template-columns:1.45fr .95fr;gap:8px;height:200px;margin:0 0 12px}
.mosaic-side{display:grid;grid-template-rows:1fr 1fr;gap:8px;min-height:0}
.tile{position:relative;overflow:hidden;border-radius:18px;background:#c9bfb8;padding:0;width:100%;height:100%;text-align:left}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .veil{position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#0009)}
.tile .cap{position:absolute;left:12px;right:12px;bottom:10px;color:#fff;pointer-events:none}
.tile .cap em{font-style:normal;font-size:11px;font-weight:800;opacity:.9}
.tile .cap b{display:block;font-size:20px;letter-spacing:-.04em;margin-top:2px}
.gal-chip{position:absolute;top:10px;right:10px;z-index:1;display:flex;align-items:center;gap:5px;background:#0007;color:#fff;font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;backdrop-filter:blur(8px)}
.gal-chip svg{width:14px;height:14px}
.gal{background:#111;color:#fff;margin:0 -16px;min-height:calc(100% + 8px);padding:4px 0 24px;display:flex;flex-direction:column}
.gal-top{display:flex;justify-content:space-between;align-items:center;padding:4px 12px 8px}
.gal-top button{width:40px;height:40px;border-radius:14px;background:#fff2;color:#fff;display:grid;place-items:center}
.gal-top button svg{width:20px;height:20px}
.gal-n{font-size:13px;font-weight:800;opacity:.8}
.gal-stage{position:relative;flex:1;min-height:420px;display:flex;align-items:center;justify-content:center}
.gal-stage img{width:100%;height:420px;object-fit:cover;display:block}
.gal-hit{position:absolute;top:0;bottom:0;width:42%;z-index:1}
.gal-hit.l{left:0}.gal-hit.r{right:0}
.gal-cap{padding:12px 16px 0;font-size:14px;font-weight:700}
.gal-cap span{display:block;font-size:12px;font-weight:500;opacity:.65;margin-top:3px}
.facts{display:flex;gap:6px;margin:0 0 12px;overflow:auto}
.facts::-webkit-scrollbar{height:0}
.facts i{flex:none;background:#fff;padding:8px 11px;border-radius:12px;font-style:normal;font-size:12px;font-weight:800;box-shadow:0 1px 2px #0000000a}
.facts i small{display:block;font-size:10px;font-weight:600;color:var(--mute)}
.sec-l{font-size:13px;font-weight:800;margin:16px 4px 8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.quick button{background:#fff;border-radius:16px;padding:12px;text-align:left;box-shadow:0 1px 2px #0000000a;display:flex;flex-direction:column;gap:8px}
.quick .qico{width:32px;height:32px;border-radius:10px;background:var(--wash);color:var(--brand);display:grid;place-items:center}
.quick .qico svg{width:18px;height:18px}
.quick b{display:block;font-size:13px}
.quick span{display:block;font-size:11px;color:var(--mute);margin-top:3px;line-height:1.3}
.mitem{display:flex;width:100%;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;text-align:left}
.mitem:last-child{border:0}
.mitem span{color:var(--mute);font-weight:500;font-size:13px}
.avatar{width:64px;height:64px;border-radius:22px;background:var(--wash);color:var(--brand);display:grid;place-items:center;font-size:22px;font-weight:800;flex:none;position:relative;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .cam{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center}
.avatar .cam svg{width:12px;height:12px}
.pcard{border-radius:20px;padding:16px;color:#fff;margin-bottom:8px;text-align:left;width:100%;position:relative;overflow:hidden}
.pcard .k{font-size:12px;opacity:.85;font-weight:700}
.pcard .sum{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.04em}
.pcard .row2{display:flex;justify-content:space-between;font-size:13px;opacity:.95}
.pcard.s{background:linear-gradient(160deg,var(--blue),var(--brand-deep))}
.pcard.p{background:linear-gradient(160deg,#3a3534,var(--ink-dark))}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid3 button{aspect-ratio:1;border-radius:16px;overflow:hidden;background:#fff;border:3px solid transparent}
.grid3 button.on{border-color:var(--brand)}
.grid3 img{width:100%;height:100%;object-fit:cover;display:block}
.prof{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:16px;margin:8px 0 12px;box-shadow:0 1px 3px #0000000c;text-align:left;width:100%}
.prof .nm{font-size:18px;font-weight:800;letter-spacing:-.03em}
.mini{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;box-shadow:0 1px 2px #0000000a}
.mini .icw{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.mini .icw svg{width:22px;height:22px}
.mini.skip .icw{background:var(--wash);color:var(--brand)}
.mini.park .icw{background:var(--ink);color:#fff}
.mini .chev{margin-left:auto;color:#c4c3bf;font-size:22px;font-weight:400}
.tx small{display:block;color:var(--mute);font-size:11px;font-weight:500;margin-top:2px}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:12px 0 20px}
.sw{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sw i{display:block;height:64px}
.sw b{display:block;padding:10px 12px 2px;font-size:13px}
.sw span{display:block;padding:0 12px 12px;font-size:12px;color:var(--mute);font-family:ui-monospace,Menlo,monospace}
.lock{width:64px;height:64px;border-radius:20px;background:var(--wash);color:var(--brand);display:grid;place-items:center;margin:18px auto 12px}
.lock svg{width:28px;height:28px}
.done svg{width:32px;height:32px}
.back svg{width:16px;height:16px}
.mitem .lead-ico{width:28px;height:28px;border-radius:8px;background:var(--wash);color:var(--brand);display:grid;place-items:center;margin-right:10px;flex:none}
.mitem .lead-ico svg{width:16px;height:16px}
.mitem{justify-content:flex-start}
.mitem .grow{flex:1;text-align:left}
.badge-ok{color:var(--go);font-size:12px;font-weight:700}

/* Главная v2 */
.brandbar{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}
.brandbar .lg{color:var(--brand);height:36px;display:flex;align-items:center;gap:8px}
.brandbar .lg svg{width:auto;height:36px;aspect-ratio:129/156;display:block;flex:none}
.brandbar .lg b{font-size:17px;font-weight:800;letter-spacing:.14em;line-height:1}
.pillb{height:36px;padding:0 12px 0 10px;border-radius:999px;background:#fff;font-size:12px;font-weight:800;border:1px solid var(--line);display:flex;align-items:center;gap:6px;color:var(--brand-deep)}
.pillb svg{width:16px;height:16px}
.wxchip{position:absolute;top:10px;left:10px;z-index:1;display:flex;align-items:center;gap:6px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;padding:6px 10px 6px 8px;border-radius:999px;box-shadow:0 2px 8px #0003}
.wxchip svg{width:16px;height:16px;color:var(--brand)}
.wxchip small{font-weight:600;color:var(--mute)}
.tile .cap em{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.status{display:flex;align-items:flex-start;gap:9px;padding:2px 4px 0;margin:0 0 14px;font-size:13px;line-height:1.45;color:var(--mute)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--go);flex:none;margin-top:6px;box-shadow:0 0 0 3px #1a7a4c1f}
.status b{color:var(--ink);font-weight:700}
.status .sep{margin:0 5px;color:#c4c3bf}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 6px}
.duo button{position:relative;height:148px;border-radius:22px;padding:14px 14px 13px;text-align:left;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,opacity .2s}
.duo button:active{transform:scale(.985)}
.duo .sk{background:linear-gradient(160deg,var(--blue) 0%,var(--brand) 55%,var(--brand-deep) 100%)}
.duo .pk{background:linear-gradient(160deg,#3a3534 0%,var(--slate) 55%,var(--ink-dark) 100%)}
.duo .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.duo .top svg{width:26px;height:26px;opacity:.95}
.duo .num{font-family:ui-monospace,Menlo,monospace;font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.7;margin-top:3px}
.duo .bot{position:relative}
.duo .sum{font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-bottom:5px}
.duo .sum small{font-size:13px;font-weight:700;letter-spacing:0;opacity:.85;margin-left:2px}
.duo b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.duo span{display:block;font-size:12px;opacity:.82;margin-top:4px;line-height:1.3}
@media(prefers-reduced-motion:reduce){.duo button{transition:none}}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px}
.sec-h b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sec-h button{font-size:12px;font-weight:700;color:var(--brand);padding:4px 0;min-height:28px}
.hs{margin:0 -16px;padding:0 16px 4px;display:flex;gap:10px;overflow:auto;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{height:0}
.hs>*{scroll-snap-align:start;flex:none}
.promo{width:236px;border-radius:20px;padding:16px;color:#fff;text-align:left;position:relative;overflow:hidden;min-height:138px;display:flex;flex-direction:column;justify-content:flex-end}
.promo .tag{position:absolute;top:12px;left:12px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#fff2;padding:5px 8px;border-radius:999px;backdrop-filter:blur(6px)}
.promo .pct{position:absolute;top:8px;right:14px;font-size:34px;font-weight:800;letter-spacing:-.05em;line-height:1}
.promo b{font-size:17px;letter-spacing:-.03em;display:block;line-height:1.15;position:relative}
.promo span{font-size:12px;opacity:.9;display:block;margin-top:4px;line-height:1.35;position:relative}
.promo.a{background:linear-gradient(150deg,var(--blue),var(--brand-deep))}
.promo.b{background:linear-gradient(150deg,#3a3534,var(--ink-dark))}
.promo.c{background:linear-gradient(150deg,var(--coral),var(--brand))}
.promo.d{background:linear-gradient(150deg,var(--brand-deep),var(--slate))}
.list{background:#fff;border-radius:18px;padding:2px 14px;box-shadow:0 1px 3px #0000000c}
.hr{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left;min-height:44px}
.hr:last-child{border:0}
.hr .dot{width:8px;height:8px;border-radius:50%;background:var(--go);flex:none;box-shadow:0 0 0 3px #1a7a4c22}
.hr .dot.off{background:#c4c3bf;box-shadow:none}
.hr .ico{width:32px;height:32px;border-radius:10px;background:var(--wash);color:var(--brand);display:grid;place-items:center;flex:none}
.hr .ico svg{width:17px;height:17px}
.hr b{flex:1;font-weight:700;line-height:1.25}
.hr b small{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:1px}
.hr span{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.hr span.on{color:var(--ink);font-weight:700}
.hr .chev{color:#c4c3bf;font-size:20px;margin-left:-4px}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.svc button{background:#fff;border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 1px 2px #0000000a}
.svc .sico{width:40px;height:40px;border-radius:13px;background:var(--wash);color:var(--brand);display:grid;place-items:center}
.svc .sico svg{width:22px;height:22px}
.svc span{font-size:11px;font-weight:700;text-align:center;line-height:1.2}
.feat{position:relative;border-radius:20px;overflow:hidden;height:186px;width:100%;text-align:left;color:#fff;background:#3a3534;display:block}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .veil{position:absolute;inset:0;background:linear-gradient(180deg,#0001 20%,#000c)}
.feat .in{position:absolute;left:14px;right:14px;bottom:14px}
.feat .in em{font-style:normal;font-size:10px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.08em}
.feat .in b{display:block;font-size:21px;letter-spacing:-.03em;margin:3px 0 3px;line-height:1.1}
.feat .in span{display:block;font-size:12px;opacity:.92;line-height:1.35}
.feat .tag{position:absolute;top:12px;left:12px;background:var(--brand);font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px}
.feat .tag.dark{background:#111c;backdrop-filter:blur(6px)}
.feat .tag.r{left:auto;right:12px}
.room{width:196px;background:#fff;border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 1px 3px #0000000c}
.room .im{height:112px;background:#cfd8e2;position:relative}
.room img{width:100%;height:100%;object-fit:cover;display:block}
.room .ph{position:absolute;top:8px;right:8px;background:#0008;color:#fff;font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;backdrop-filter:blur(6px)}
.room .in{padding:10px 12px 12px}
.room b{display:block;font-size:14px;letter-spacing:-.02em;line-height:1.2}
.room span{display:block;font-size:11px;color:var(--mute);margin-top:4px}
.room .pr{font-size:12px;font-weight:800;color:var(--brand);margin-top:8px}
.soc{display:flex;gap:8px;margin:10px 0 0}
.soc button{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--brand-deep);border:1px solid var(--line)}
.soc button svg{width:20px;height:20px}
.soc .lbl{flex:1;display:flex;align-items:center;font-size:12px;color:var(--mute);font-weight:600;padding-left:4px}
.foot{font-size:11px;color:var(--mute);line-height:1.6;margin:16px 4px 0}
.foot button{color:var(--brand);font-weight:700;font-size:11px;padding:2px 0}
.foot .sep{margin:0 5px;color:#c4c3bf}
.panel.info{max-height:90%;overflow:auto;padding-bottom:26px}
.panel .pimg{height:156px;border-radius:16px;overflow:hidden;margin:2px 0 12px;position:relative;background:#cfd8e2}
.panel .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.panel .pimg .tag{position:absolute;top:10px;left:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px}
.panel .phead{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
.panel .phead .sico{width:48px;height:48px;border-radius:15px;background:var(--wash);color:var(--brand);display:grid;place-items:center;flex:none}
.panel .phead .sico svg{width:26px;height:26px}
.panel .phead .h1{font-size:22px}
.panel .ptxt{font-size:14px;line-height:1.5;color:#3a3a38;margin:0 0 10px}
.pl{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.pl:last-child{border:0}
.pl span{color:var(--mute)}
.pl b{font-variant-numeric:tabular-nums;text-align:right;flex:none}
.pl.h{padding-top:12px;font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;border:0;padding-bottom:2px}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.act,.svc button,.room,.hr,.pillb,.soc button{transition:box-shadow .2s,background-color .2s,border-color .2s}
.act:hover,.svc button:hover,.room:hover{box-shadow:0 6px 18px #0000001c}
.pillb:hover,.soc button:hover{border-color:var(--brand);background:var(--wash)}
.tile,.promo,.feat{transition:opacity .2s,transform .2s}
.tile:active,.promo:active,.feat:active{opacity:.92}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.rise{animation:none}.act,.svc button,.room,.tile,.promo,.feat{transition:none}}
@media(max-width:980px){.page{grid-template-columns:1fr}.stage{position:relative;height:auto}}
body.export-mode{background:#dce3ea;margin:0}
body.export-mode .page{display:none!important}
.export-board{display:flex;flex-wrap:wrap;gap:48px 40px;padding:56px;align-items:flex-start}
.export-phone{display:flex;flex-direction:column;gap:12px;align-items:center}
.export-phone .lbl{font:800 13px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:#14264e}
</style>
</head>

api:`
  <h2>ТЗ на API v1</h2>
  <p class="lead">Полный контракт: файл <code>tz-api.html</code> и Word <code>ТЗ-API-v1-Волен.docx</code> (для Google Docs). Ниже — оглавление ручек. Клиент не ходит в /mobile/api.</p>

  <table class="tbl">
    <tr><th>Ручка</th><th>Кто</th><th>Смысл</th></tr>
    <tr><td><code>POST /v1/auth/otp/request</code></td><td>гость</td><td>phone → exists, звонок/SMS, retry_after</td></tr>
    <tr><td><code>POST /v1/auth/otp/verify</code></td><td>гость</td><td>код → JWT; нет user — создать</td></tr>
    <tr><td><code>POST /v1/auth/refresh</code></td><td>—</td><td>новая пара, rotation</td></tr>
    <tr><td><code>POST /v1/auth/logout</code></td><td>сессия</td><td>сжечь refresh</td></tr>
    <tr><td><code>GET /v1/me</code></td><td>сессия</td><td>id, phone, имя, фото</td></tr>
    <tr><td><code>PATCH /v1/me</code></td><td>сессия</td><td>first_name, last_name</td></tr>
    <tr><td><code>POST /v1/me/photo</code></td><td>сессия</td><td>multipart jpeg/png</td></tr>
    <tr><td><code>POST /v1/me/email/request</code></td><td>сессия</td><td>почта → код на ящик</td></tr>
    <tr><td><code>POST /v1/me/email/verify</code></td><td>сессия</td><td>код → email в /me</td></tr>
    <tr><td><code>GET /v1/home</code></td><td>гость</td><td>resort, часы, сезон, превью карт</td></tr>

  </table>
  <p>Закрыть <code>users?method=filter</code>. Приёмка и примеры JSON — в <code>tz-api.html</code>.</p>
